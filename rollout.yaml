apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: myapp
spec:
  replicas: 3

  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 30s

      - setWeight: 50
      - pause:
          duration: 30s

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp
        image: 816069142280.dkr.ecr.ap-northeast-2.amazonaws.com/myapp:v1
        ports:
        - containerPort: 80
